# P0-1 core suite — deterministic (CI-blocking). No live LLM required.
suite: core
version: 1
defaults:
  plane: file
  skill_id: data.bi
  max_retries: 2
  default_limit: 200
  allow_heuristic_sql: false
  fixture: fixtures/file/sales_mini.csv

cases:
  # --- Gate negatives (sql_inject) ---
  - id: gate.deny.drop
    mode: sql_inject
    sql: "DROP TABLE {{table}}"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  - id: gate.deny.insert
    mode: sql_inject
    sql: "INSERT INTO {{table}} (region, product, amount) VALUES ('X', 'Y', 1)"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  - id: gate.deny.multi_stmt
    mode: sql_inject
    sql: "SELECT 1 FROM {{table}}; SELECT 2 FROM {{table}}"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  - id: gate.deny.wrong_table
    mode: sql_inject
    sql: "SELECT * FROM other_table"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  - id: gate.deny.update
    mode: sql_inject
    sql: "UPDATE {{table}} SET amount = 0"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  - id: gate.deny.delete
    mode: sql_inject
    sql: "DELETE FROM {{table}}"
    tags: [gate, negative]
    expect:
      gate: deny
      success: false
      failure_class: policy_denied
      must_not_execute: true

  # --- Gate allow + execute (file plane) ---
  - id: gate.allow.select_preview
    mode: sql_inject
    sql: "SELECT region, product, amount FROM {{table}}"
    execute: true
    tags: [gate, positive, execute]
    expect:
      gate: allow
      success: true
      sql_constraints:
        must_include_tables: ["{{table}}"]
        must_match_any: ["SELECT"]
        must_not_match: ["INSERT", "DROP", "DELETE"]
      row_checks:
        min_rows: 5
        max_rows: 5
        columns_contain: ["region", "amount"]

  - id: gate.allow.agg_sum
    mode: sql_inject
    sql: 'SELECT region, SUM(amount) AS total FROM {{table}} GROUP BY region ORDER BY total DESC'
    execute: true
    tags: [gate, positive, aggregate]
    expect:
      gate: allow
      success: true
      sql_constraints:
        must_include_tables: ["{{table}}"]
        must_match_any: ["SUM", "sum"]
      row_checks:
        min_rows: 4
        max_rows: 4
        columns_contain: ["region", "total"]
        values_contain:
          - column: region
            value: North
          - column: region
            value: South

  - id: file.fixture.row_count
    mode: fixture_meta
    tags: [fixture]
    expect:
      fixture_row_count: 5
      fixture_columns: ["region", "product", "amount"]

  # --- Pipeline honesty: no key + no heuristic must not silently succeed ---
  - id: pipeline.no_key.no_heuristic
    mode: pipeline
    question: "各地区销售额合计是多少？"
    tags: [pipeline, honesty]
    expect:
      success: false
      heuristic_forbidden: true

  # --- postgres_ro (conditional; skipped when POSTGRES_RO_DSN unset) ---
  - id: postgres_ro.gate.allow_preview
    mode: sql_inject
    plane: postgres_ro
    table: public.demo_orders
    allowed_tables: ["public.demo_orders", "public.demo_customers"]
    sql: 'SELECT order_id, product, amount FROM "public"."demo_orders"'
    execute: true
    tags: [postgres_ro, gate, positive]
    require_postgres_ro: true
    expect:
      gate: allow
      success: true
      row_checks:
        min_rows: 1
        columns_contain: ["order_id", "amount"]

  - id: postgres_ro.gate.deny_write
    mode: sql_inject
    plane: postgres_ro
    table: public.demo_orders
    allowed_tables: ["public.demo_orders"]
    sql: 'DELETE FROM "public"."demo_orders"'
    tags: [postgres_ro, gate, negative]
    require_postgres_ro: true
    expect:
      gate: deny
      failure_class: policy_denied
      must_not_execute: true

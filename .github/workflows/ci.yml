# T-13 — CI Release Gate (optional P2)
# Codifies the existing operator gate; not a DevOps / CD platform.
#
# Scope: frontend build/lint + pip install → compose smoke → smoke_release_gate
# Out: K8s / Helm / Terraform / cloud deploy / production CD / live LLM

name: CI Release Gate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aibi
          POSTGRES_PASSWORD: aibi_dev_password
          POSTGRES_DB: aibi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aibi -d aibi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aibi:aibi_dev_password@localhost:5433/aibi
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-for-production
      APP_ENV: ci
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      ANALYSIS_RUNTIME: agent
      ALLOW_HEURISTIC_SQL: "true"
      SKILL_DATA_BI_ENABLED: "true"
      SKILL_DATA_BI_VERSION: "1.0.0"
      RUN_TIMEOUT_SECONDS: "120"
      RUN_MAX_IN_FLIGHT: "4"
      ANALYSIS_QUEUE_MAX_DEPTH: "50"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_AUTH_PER_MINUTE: "30"
      RATE_LIMIT_TASK_CREATE_PER_MINUTE: "60"
      POSTGRES_RO_DSN: postgresql://aibi_ro:aibi_ro_password@localhost:5434/aibi_data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Compose file syntax
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Docker compose wiring smoke (static)
        run: python backend/scripts/smoke_docker_compose.py

      - name: Start postgres_ro fixture (M3)
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres_ro
          for i in $(seq 1 30); do
            if docker compose -f docker/docker-compose.yml exec -T postgres_ro \
              pg_isready -U aibi_data_admin -d aibi_data; then
              echo "postgres_ro ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres_ro failed to become ready"
          docker compose -f docker/docker-compose.yml logs postgres_ro
          exit 1

      - name: Release gate
        working-directory: backend
        run: python scripts/smoke_release_gate.py

      - name: Compose teardown (postgres_ro)
        if: always()
        run: docker compose -f docker/docker-compose.yml stop postgres_ro || true
